name: Update HuevoBet matches

on:
  schedule:
    - cron: '*/15 * * * *'     # каждые 15 минут
  workflow_dispatch:            # ручной запуск

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch matches from PandaScore
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: node scripts/fetch-matches.js

      - name: Commit & push if changed
        run: |
          git config user.name  "huevo-bot"
          git config user.email "bot@huevo.local"
          git add data/matches.json
          git diff --staged --quiet || git commit -m "chore: update matches $(date -u +%FT%TZ)"
          git push
