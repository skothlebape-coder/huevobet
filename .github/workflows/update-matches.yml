
name: Update HuevoBet matches

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Fetch PandaScore matches
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          from datetime import datetime, timezone

          token = os.environ.get("PANDASCORE_TOKEN")
          if not token:
              raise SystemExit("PANDASCORE_TOKEN is missing")

          endpoints = {
              "dota2_upcoming": "dota2/matches/upcoming",
              "dota2_running": "dota2/matches/running",
              "dota2_past": "dota2/matches/past",
              "cs2_upcoming": "csgo/matches/upcoming",
              "cs2_running": "csgo/matches/running",
              "cs2_past": "csgo/matches/past",
          }

          result = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "matches": {}
          }

          for name, endpoint in endpoints.items():
              url = f"https://api.pandascore.co/{endpoint}?per_page=50"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "User-Agent": "HuevoBet"
                  }
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  result["matches"][name] = json.load(response)

              print(f"{name}: {len(result['matches'][name])} matches")

          os.makedirs("data", exist_ok=True)

          with open("data/matches.json", "w", encoding="utf-8") as file:
              json.dump(result, file, ensure_ascii=False)

          print("Saved data/matches.json")
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
